name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Core Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core test environment
        run: python -m pip install -e ".[test]"
      - name: Verify Textual is not installed or imported
        run: >-
          python -c "import importlib.util, sys; import prolog_tsetlin;
          assert importlib.util.find_spec('textual') is None;
          assert not any(name == 'textual' or name.startswith('textual.') for name in sys.modules)"
      - name: Run core Python tests
        run: >-
          python -m pytest tests/python
          --ignore=tests/python/test_tui.py
          --ignore=tests/python/test_frontend_contract.py
          --ignore=tests/python/test_single_pane.py
          --ignore=tests/python/test_single_pane_snapshot.py
          --ignore=tests/python/test_tui_launcher.py

  tui:
    name: TUI / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install TUI test environment
        run: python -m pip install -e ".[tui,test,tui-test]"
      - name: Verify TUI test dependencies
        run: >-
          python -c "import importlib.util;
          assert importlib.util.find_spec('textual') is not None;
          assert importlib.util.find_spec('pytest_textual_snapshot') is not None"
      - name: Run TUI tests
        run: >-
          python -m pytest
          tests/python/test_tui.py
          tests/python/test_help_topics.py
          tests/python/test_frontend_contract.py
          tests/python/test_single_pane.py
          tests/python/test_single_pane_snapshot.py
          tests/python/test_tui_launcher.py

  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Configure PTM
        run: >-
          cmake -S . -B out/ci-native
          -DPTM_BUILD_TESTS=ON
          -DPTM_BUILD_BENCHMARKS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build PTM
        run: cmake --build out/ci-native --config Release --parallel
      - name: Run native tests
        run: ctest --test-dir out/ci-native -C Release --output-on-failure
      - name: Install PTM
        run: cmake --install out/ci-native --config Release --prefix "${{ runner.temp }}/ptm-install"
      - name: Configure clean consumer
        run: >-
          cmake -S tests/consumer -B out/ci-consumer
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/ptm-install"
          -DCMAKE_BUILD_TYPE=Release
      - name: Build clean consumer
        run: cmake --build out/ci-consumer --config Release --parallel
      - name: Run clean consumer
        run: ctest --test-dir out/ci-consumer -C Release --output-on-failure

  data:
    name: Streaming data adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install data adapter tests
        run: python -m pip install -e ".[data,test]"
      - name: Run connector and transform tests
        run: >-
          python -m pytest
          tests/python/test_data_connectors.py
          tests/python/test_record_transforms.py

  documentation:
    name: Documentation / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install documentation toolchain
        run: python -m pip install -e ".[docs]"
      - name: Validate documentation metadata and links
        run: |
          python scripts/render_help_reference.py --check
          python scripts/render_cli_reference.py --check
          python scripts/check_docs.py
          python scripts/check_markdown_links.py
      - name: Build HTML documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html -c docs . out/docs/html

  prolog:
    name: GNU Prolog bounded search
    runs-on: ubuntu-latest
    env:
      PTM_GPROLOG: /usr/bin/gprolog
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GNU Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes gprolog
      - name: Install PTM tests
        run: python -m pip install -e ".[test,tui]"
      - name: Compile bounded search templates
        run: |
          gplc -c --no-susp-warn -o /tmp/bounded_threshold_search.o prolog/bounded_threshold_search.pl
          gplc -c --no-susp-warn -o /tmp/bounded_structure_search.o prolog/bounded_structure_search.pl
          gplc -c --no-susp-warn -o /tmp/pta_ontology.o prolog/pta_ontology.pl
          gplc -c --no-susp-warn -o /tmp/pta_input.o prolog/pta_input.pl
          gplc -c --no-susp-warn -o /tmp/pta_deescalation.o prolog/pta_deescalation.pl
          gplc -c --no-susp-warn -o /tmp/pta_escalation.o prolog/pta_escalation.pl
          echo "=== PTA integration driver ===" | cat
          printf ":- include('prolog/pta_ontology.pl').\n:- include('prolog/pta_input.pl').\n:- include('prolog/pta_deescalation.pl').\n:- include('prolog/pta_escalation.pl').\n:- initialization((write('PTA collective compiled'), nl, halt)).\n" > /tmp/pta_driver.pl
          gplc --no-top-level -o /tmp/pta_driver /tmp/pta_driver.pl
          /tmp/pta_driver
      - name: Run Prolog bridge tests
        run: >-
          python -m pytest
          tests/python/test_prolog_bridge.py
          tests/python/test_search_service.py
          tests/python/test_tui.py::test_tui_runs_repair_shows_counterexamples_and_exports

  sanitizers:
    name: Sanitizers (ASan+UBSan) / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Configure PTM with sanitizers
        run: >-
          cmake -S . -B out/ci-sanitize
          -DPTM_BUILD_TESTS=ON
          -DPTM_BUILD_BENCHMARKS=OFF
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build PTM (sanitized)
        run: cmake --build out/ci-sanitize --config RelWithDebInfo --parallel
      - name: Run sanitized native tests
        run: ctest --test-dir out/ci-sanitize -C RelWithDebInfo --output-on-failure
      - name: Install sanitized PTM
        run: cmake --install out/ci-sanitize --config RelWithDebInfo --prefix "${{ runner.temp }}/ptm-sanitize-install"
      - name: Install Python package for mutation smoke
        run: python -m pip install -e .
      - name: Mutation smoke (ASan/UBSan) — mutated artifacts must be rejected
        run: |
          python -c "
          import subprocess, json, struct, hashlib, tempfile, os
          from pathlib import Path
          from prolog_tsetlin.reference import ScalarBinaryTsetlinMachine
          from prolog_tsetlin.model_artifact import export_packed_tm, export_graph_tm
          from prolog_tsetlin.graph import GraphInput
          from prolog_tsetlin.graph.graph_tm import GraphTsetlinMachine
          import math

          def rehash(data: bytearray) -> bytes:
              content = bytes(data[:-32])
              data[-32:] = hashlib.sha256(content).digest()
              return bytes(data)

          # 1) Integrity-only flips (no rehash) — must be integrity error
          tm = ScalarBinaryTsetlinMachine(number_of_clauses=2, number_of_features=2, threshold=2)
          art = export_packed_tm(tm.snapshot(), name='mutation-smoke', path=None)
          data = bytearray(art.serialized)
          for offset in [64, 100, 200]:
              if offset < len(data):
                  data[offset] ^= 0x01
                  Path(tempfile.gettempdir()+f'/fuzz_{offset}.ptm').write_bytes(data)
                  data[offset] ^= 0x01

          # 2) Graph hostile but correctly rehashed — parser must reject as INVALID_FORMAT under ASan/UBSan
          gtm = GraphTsetlinMachine(depth=2, clauses=2, hv_dim=256, seed=0)
          g = GraphInput.create(node_count=2, edges=[(0,1,0)], node_properties={0:['A']})
          g_art = export_graph_tm(gtm, [g], name='hostile-base')
          base = bytearray(g_art.serialized)
          # a) manifest/payload weight mismatch (flip weight byte then rehash)
          def write_hostile(name, mutator):
              data = bytearray(base)
              mutator(data)
              Path(tempfile.gettempdir()+f'/hostile_{name}.ptm').write_bytes(rehash(data))

          def flip_weight(data):
              manifest_size = struct.unpack_from('<Q', data, 24)[0]
              payload_off = 64 + manifest_size
              # header 32 then first weight at +32
              data[payload_off + 32] ^= 0xFF

          write_hostile('weight_mismatch', flip_weight)

          def oversized_graph(data):
              manifest_size = struct.unpack_from('<Q', data, 24)[0]
              payload_off = 64 + manifest_size
              # graph_len at payload_off+32+16 (header+weights) -> flip to max
              off = payload_off + 32 + 16
              struct.pack_into('<I', data, off, 1<<20)  # glen = 1MiB (over bound but still parse)

          write_hostile('oversized_glen', oversized_graph)

          def invalid_property_type(data):
              manifest_size = struct.unpack_from('<Q', data, 24)[0]
              payload_off = 64 + manifest_size
              off = payload_off + 32 + 16
              glen = struct.unpack_from('<I', data, off)[0]
              gjson = json.loads(bytes(data[off+8:off+8+glen]).decode())
              gjson['node_properties'][0][0] = float('inf')  # will be serialized as non-finite -> but we inject invalid JSON
              # Instead inject an object type for property (invalid)
              gjson['node_properties'][0][0] = {'bad': 'object'}
              new = json.dumps(gjson, sort_keys=True, separators=(',', ':')).encode()
              # Keep same glen slot if new shorter, pad; if longer, expand (simpler: just corrupt first byte to '{' + '\"bad\"')
              data[off+8:off+8+len(new)] = new
              # keep trailing bytes

          write_hostile('invalid_prop', invalid_property_type)

          def too_many_edge_types(data):
              manifest_size = struct.unpack_from('<Q', data, 24)[0]
              payload_off = 64 + manifest_size
              off = payload_off + 32 + 16
              glen = struct.unpack_from('<I', data, off)[0]
              gjson = json.loads(bytes(data[off+8:off+8+glen]).decode())
              # Add 17 distinct edge types
              gjson['edges'] = [[0,1,i] for i in range(17)]
              gjson['edge_types'] = list(range(17))
              gjson['node_count'] = 2
              new = json.dumps(gjson, sort_keys=True, separators=(',', ':')).encode()
              if len(new) <= glen:
                  data[off+8:off+8+len(new)] = new
                  # zero rest
                  for i in range(len(new), glen):
                      data[off+8+i] = 32  # space
              else:
                  # extend payload: splice new len
                  new_data = data[:off] + struct.pack('<II', len(new), 1) + new + data[off+8+glen:]
                  data[:] = new_data
                  # fix payload size in header
                  manifest_size2 = struct.unpack_from('<Q', data, 24)[0]
                  payload_size = len(data) - 64 - manifest_size2 - 32
                  struct.pack_into('<Q', data, 32, payload_size)

          write_hostile('many_edge_types', too_many_edge_types)

          print('hostile rehashed artifacts written')
          "
          set -e
          for f in /tmp/fuzz_*.ptm /tmp/hostile_*.ptm; do
            [ -e "$f" ] || continue
            echo "checking $f"
            rc=0
            out/ci-sanitize/ptmrt verify "$f" || rc=$?
            if [ $rc -eq 2 ]; then
              echo "mutated correctly rejected (exit 2): $f"
            elif [ $rc -eq 0 ]; then
              echo "ERROR: mutated artifact should not verify: $f" >&2
              exit 1
            else
              echo "ERROR: unexpected exit $rc (expected 2) for $f — sanitizer abort or wrong rejection" >&2
              exit 1
            fi
          done
          echo 'mutation smoke done — sanitizers clean, rejections as expected (parser exercised)'

  distribution:
    name: Distribution and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Check release metadata
        run: python scripts/check_release_metadata.py
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Test the built wheel in isolation
        run: |
          python -m venv out/wheel-smoke
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          out/wheel-smoke/bin/python -m pip install "${wheel}[tui]"
          out/wheel-smoke/bin/ptm --version
          out/wheel-smoke/bin/python -c "from prolog_tsetlin import TokenAdapter; assert TokenAdapter('text').tokenize('Hello') == ('hello',)"
          out/wheel-smoke/bin/python -c "from importlib.resources import files; from prolog_tsetlin.tui.single_pane import SinglePaneApp; assert files('prolog_tsetlin.tui.single_pane').joinpath('ptm.tcss').is_file(); assert SinglePaneApp.CSS_PATH == 'ptm.tcss'"
          test -f out/wheel-smoke/share/prolog-tsetlin-machine/prolog/bounded_structure_search.pl

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - python
      - tui
      - native
      - data
      - documentation
      - prolog
      - sanitizers
      - distribution
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        shell: bash
        run: |
          results=(
            "${{ needs.python.result }}"
            "${{ needs.tui.result }}"
            "${{ needs.native.result }}"
            "${{ needs.data.result }}"
            "${{ needs.documentation.result }}"
            "${{ needs.prolog.result }}"
            "${{ needs.sanitizers.result }}"
            "${{ needs.distribution.result }}"
          )

          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Required upstream job result: $result" >&2
              exit 1
            fi
          done
