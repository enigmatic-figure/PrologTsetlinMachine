[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prolog-tsetlin-machine"
dynamic = ["version"]
description = "Hybrid Tsetlin, Fredkin, and bounded-Prolog research runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Prolog",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/enigmatic-figure/PrologTsetlinMachine"
Documentation = "https://github.com/enigmatic-figure/PrologTsetlinMachine/tree/main/docs"
Issues = "https://github.com/enigmatic-figure/PrologTsetlinMachine/issues"

[project.optional-dependencies]
tui = ["textual>=8.2,<9", "textual-plotext>=1.0"]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "hypothesis>=6.100,<7",
]
tui-test = ["pytest-textual-snapshot>=1.1,<2"]
data = ["numpy>=1.26,<3", "pyarrow>=18,<26", "Pillow>=12,<13"]
graph = []
docs = [
    "sphinx>=7,<8.2; python_version < '3.11'",
    "myst-parser>=4,<5; python_version < '3.11'",
    "sphinx>=8.2,<10; python_version >= '3.11'",
    "myst-parser>=5,<6; python_version >= '3.11'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
ptm = "prolog_tsetlin.cli:main"
ptm-tui = "prolog_tsetlin.tui:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "prolog_tsetlin._version.__version__"}

[tool.setuptools.data-files]
"share/prolog-tsetlin-machine/prolog" = [
    "prolog/bounded_structure_search.pl",
    "prolog/bounded_threshold_search.pl",
    "prolog/pta_ontology.pl",
    "prolog/pta_input.pl",
    "prolog/pta_deescalation.pl",
    "prolog/pta_escalation.pl",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"prolog_tsetlin.tui.single_pane" = ["*.tcss"]
